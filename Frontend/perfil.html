<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">🛒 Mi Despensa Virtual</div>
    <div class="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="carrito.html">Carrito</a>
        <a href="pedidos.html">Pedidos</a>
    </div>
</nav>

<section class="container">

    <div class="card" style="max-width:700px;margin:auto;text-align:center;">

        <img 
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            style="width:140px;height:140px;border-radius:50%;object-fit:cover;margin-bottom:20px;"
            alt="Perfil">

        <h1>Mi Perfil</h1>
        <p>Información del usuario registrado.</p>

        <br>

        <div style="text-align:left;display:grid;gap:15px;">

            <div class="card">
                <strong>Nombre:</strong>
                <span id="nombreUsuario">Juan Pérez</span>
            </div>

            <div class="card">
                <strong>Correo:</strong>
                <span id="correoUsuario">usuario@gmail.com</span>
            </div>

            <div class="card">
                <strong>Teléfono:</strong>
                <span id="telefonoUsuario">0991234567</span>
            </div>

            <div class="card">
                <strong>Dirección:</strong>
                <span id="direccionUsuario">Guayaquil, Ecuador</span>
            </div>

        </div>

        <br>

        <button class="btn" onclick="editarPerfil()">Editar perfil</button>
        <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>

    </div>

</section>

<footer>
    <p>© 2026 Mi Despensa Virtual</p>
</footer>

<script src="js/perfil.js"></script>

</body>
</html>
