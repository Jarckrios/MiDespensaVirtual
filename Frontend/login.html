<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-card">

    <div style="text-align:center;margin-bottom:25px;">
        <h1 style="font-size:55px;">🛒</h1>
        <h2>Mi Despensa Virtual</h2>
        <p>Bienvenido nuevamente</p>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label>Correo electrónico</label>
            <input class="form-control" type="email" id="correo" placeholder="ejemplo@gmail.com" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input class="form-control" type="password" id="password" placeholder="Ingrese su contraseña" required>
        </div>

        <label style="display:flex;align-items:center;gap:8px;color:white;margin-bottom:20px;">
            <input type="checkbox" id="mostrarPassword">
            Mostrar contraseña
        </label>

        <p id="mensaje" style="text-align:center;margin-bottom:15px;"></p>

        <button class="btn" style="width:100%;" type="submit">
            Ingresar
        </button>

    </form>

    <div style="text-align:center;margin-top:25px;">
        <p>¿No tienes una cuenta?</p>
        <a href="registro.html">Crear una cuenta</a>
        <br>
        <a href="index.html">← Volver al inicio</a>
    </div>

</div>

<script src="services/api.js"></script>
<script src="js/login.js"></script>

</body>

</html>
